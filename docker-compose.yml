version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: proctoride
      POSTGRES_USER: proctoride
      POSTGRES_PASSWORD: proctoride
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  judge0:
    image: judge0/judge0:latest
    ports:
      - "2358:2358"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

volumes:
  postgres_data:
